# Dependabot configuration for aws-samples/amazon-neptune-samples
#
# This repository contains many independent sample sub-projects across several
# ecosystems (npm, pip, maven). Each maintained sub-project is registered below
# so Dependabot opens grouped, weekly version-update PRs scoped to that folder.
#
# NOTE: The "amazon-neptune-and-aws-cdk-for-amundsen" sample is intentionally
# omitted. Amundsen has been deprecated and that sample is no longer maintained
# (see its README). Do not add it back here.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # ---------------------------------------------------------------------------
  # npm / JavaScript
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/gremlin/chatbot-full-stack-application/code/web-ui/neptune-chatbot"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/gremlin/ogma-neptune"
