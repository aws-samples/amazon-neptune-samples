# CodeQL code scanning (advanced setup).
#
# Replaces GitHub's default setup so that:
#   - the security-extended query suite is used (broader than the default suite)
#   - .github/codeql/codeql-config.yml (paths-ignore for dependency and generated code) is honored
#   - this workflow run becomes a status check that branch protection or auto-merge can require
#
# IMPORTANT: disable CodeQL "default setup" (Settings > Code security > Code scanning)
# before this workflow runs. While default setup is enabled, GitHub rejects results
# uploaded by an advanced-setup workflow.
#
# scripts/run-codeql.sh runs the same languages, build modes, and config locally.
name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Weekly baseline scan, matching the previous default-setup schedule.
    - cron: '21 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # This repo holds many independent samples (several Maven projects on
          # different JDKs, some of which no longer compile), so Java and C# are
          # analyzed without building. "none" covers every source file.
          - language: java-kotlin
            build-mode: none
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          # Go does not support build-mode "none".
          - language: go
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
